<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shareholder Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .company-card {
            cursor: pointer;
            transition: all 0.3s;
        }
        .company-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .shareholder-row {
            cursor: pointer;
        }
        .shareholder-row:hover {
            background-color: #f8f9fa;
        }
        .company-cell {
            cursor: pointer;
            color: #0d6efd;
            text-decoration: underline;
        }
        .company-cell:hover {
            color: #0a58ca;
        }
        #companyDetails, #shareholderDetails {
            display: none;
        }
        .nav-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Shareholder Analysis</h1>
        
        <!-- Navigation Buttons -->
        <div class="nav-buttons">
            <button class="btn btn-primary" onclick="showCompanyList(true)">Home</button>
        </div>

        <!-- Search Box -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search shareholders...">
                    <button class="btn btn-outline-secondary" type="button" onclick="searchShareholders()">Search</button>
                </div>
            </div>
        </div>
        
        <!-- Company List -->
        <div id="companyList" class="row">
            <!-- Companies will be populated here -->
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="mt-4" style="display: none;">
            <h3>Search Results</h3>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Shareholder</th>
                            <th>Company</th>
                            <th>Shares Held</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>
                    <tbody id="searchResultsTable">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Company Details -->
        <div id="companyDetails" class="mt-4">
            <div class="d-flex justify-content-start align-items-center mb-3">
                <button class="btn btn-secondary" onclick="showCompanyList(false)">Back</button>
            </div>
            <h2 id="companyName"></h2>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Shareholder</th>
                            <th>Shares Held</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>
                    <tbody id="shareholderTable">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Shareholder Details -->
        <div id="shareholderDetails" class="mt-4">
            <div class="d-flex justify-content-start align-items-center mb-3">
                <button class="btn btn-secondary" onclick="showCompanyDetails(currentCompany)">Back</button>
            </div>
            <h2 id="shareholderName"></h2>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Company</th>
                            <th>Shares Held</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>
                    <tbody id="holdingsTable">
                    </tbody>
                </table>
            </div>
            <div id="shareholderUrl" class="mt-4 text-center">
                <!-- URL link will be added here -->
            </div>
        </div>
    </div>

        let data = null;
        let currentCompany = null;
        let currentShareholder = null;

        // 处理数据
        function processCSV(csv) {
            const lines = csv.split('\n');
            const headers = lines[0].split(',');
            const result = [];
            
            for(let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if(!line) continue;
                
                const values = line.split(',');
                if(values.length < headers.length) continue;
                
                const obj = {};
                for(let j = 0; j < headers.length; j++) {
                    let value = values[j] || '';
                    value = value.replace(/^"|"$/g, '').trim();
                    value = value.replace(/\n/g, ' ');
                    obj[headers[j]] = value;
                }
                result.push(obj);
            }
            
            return result;
        }

        // 初始化
        data = processCSV(csvData);
        displayCompanies();

        function displayCompanies() {
            const companyMap = new Map();
            
            data.forEach(item => {
                if (!companyMap.has(item.Ticker)) {
                    companyMap.set(item.Ticker, {
                        ticker: item.Ticker,
                        name: item.Company,
                        date: item.Date,
                        url: item.URL
                    });
                }
            });
            
            const companies = Array.from(companyMap.values());
            
            const companyList = document.getElementById('companyList');
            companyList.className = 'row';
            companyList.innerHTML = companies.map(company => `
                <div class="col-md-4 mb-4">
                    <div class="card company-card" onclick="showCompanyDetails('${company.ticker}')">
                        <div class="card-body">
                            <h5 class="card-title">${company.ticker}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${company.name}</h6>
                            <p class="card-text">Date: ${company.date}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showCompanyDetails(ticker) {
            currentCompany = ticker;
            const companyData = data.filter(item => item.Ticker === ticker);
            const companyName = companyData[0].Company;
            const companyUrl = companyData[0].URL;
            
            const companyList = document.getElementById('companyList');
            companyList.style.display = 'none';
            
            const companyDetails = document.getElementById('companyDetails');
            companyDetails.style.display = 'block';
            document.getElementById('shareholderDetails').style.display = 'none';
            
            document.getElementById('companyName').textContent = `${ticker} - ${companyName}`;
            
            const shareholderTable = document.getElementById('shareholderTable');
            shareholderTable.innerHTML = companyData.map(item => `
                <tr class="shareholder-row" onclick="showShareholderDetails('${item.Shareholder}')">
                    <td>${item.Shareholder}</td>
                    <td>${item.SharesHeld}</td>
                    <td>${item.Percentage}%</td>
                </tr>
            `).join('');

            // 移除已存在的source link
            const existingSourceLink = companyDetails.querySelector('.mt-4.text-center');
            if (existingSourceLink) {
                existingSourceLink.remove();
            }

            const sourceLink = document.createElement('div');
            sourceLink.className = 'mt-4 text-center';
            sourceLink.innerHTML = `<a href="${companyUrl}" target="_blank" class="btn btn-outline-primary">View Source Document - ${companyName}</a>`;
            companyDetails.appendChild(sourceLink);
        }

        function showShareholderDetails(shareholder) {
            currentShareholder = shareholder;
            const shareholderData = data.filter(item => item.Shareholder === shareholder);
            
            const companyList = document.getElementById('companyList');
            companyList.style.display = 'none';
            
            document.getElementById('companyDetails').style.display = 'none';
            document.getElementById('shareholderDetails').style.display = 'block';
            
            document.getElementById('shareholderName').textContent = shareholder;
            
            const holdingsTable = document.getElementById('holdingsTable');
            holdingsTable.innerHTML = shareholderData.map(item => `
                <tr class="company-row" onclick="showCompanyDetails('${item.Ticker}')">
                    <td>${item.Company}</td>
                    <td>${item.SharesHeld}</td>
                    <td>${item.Percentage}%</td>
                </tr>
            `).join('');

            const urlContainer = document.getElementById('shareholderUrl');
            urlContainer.innerHTML = `<a href="${shareholderData[0].URL}" target="_blank" class="btn btn-outline-primary">View Original Document</a>`;
        }

        function showCompanyList(shouldRefresh = false) {
            const companyList = document.getElementById('companyList');
            companyList.style.display = 'block';
            companyList.className = 'row';
            
            document.getElementById('companyDetails').style.display = 'none';
            document.getElementById('shareholderDetails').style.display = 'none';
            document.getElementById('searchResults').style.display = 'none';
            
            const sourceLink = document.querySelector('#companyDetails .mt-4.text-center');
            if (sourceLink) {
                sourceLink.remove();
            }
            
            displayCompanies();
            
            // 从详情页返回到主页时也刷新
            if (shouldRefresh || document.getElementById('companyDetails').style.display === 'block' || 
                document.getElementById('shareholderDetails').style.display === 'block') {
                window.location.reload();
            }
        }

        function searchShareholders() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (!searchTerm) {
                showCompanyList();
                return;
            }

            const searchResults = data.filter(item => 
                item.Shareholder.toLowerCase().includes(searchTerm)
            );

            const companyList = document.getElementById('companyList');
            companyList.style.display = 'none';
            
            document.getElementById('companyDetails').style.display = 'none';
            document.getElementById('shareholderDetails').style.display = 'none';
            
            const searchResultsDiv = document.getElementById('searchResults');
            searchResultsDiv.style.display = 'block';
            
            const searchResultsTable = document.getElementById('searchResultsTable');
            searchResultsTable.innerHTML = searchResults.map(item => `
                <tr data-shareholder="${item.Shareholder}" data-ticker="${item.Ticker}">
                    <td>${item.Shareholder}</td>
                    <td class="company-cell">${item.Company}</td>
                    <td>${item.SharesHeld}</td>
                    <td>${item.Percentage}%</td>
                </tr>
            `).join('');

            // 使用事件委托处理点击事件
            searchResultsTable.addEventListener('click', function(e) {
                const row = e.target.closest('tr');
                if (!row) return;

                const shareholder = row.dataset.shareholder;
                const ticker = row.dataset.ticker;

                // 清除搜索框内容
                document.getElementById('searchInput').value = '';
                // 隐藏搜索结果区域
                document.getElementById('searchResults').style.display = 'none';

                if (e.target.classList.contains('company-cell')) {
                    showCompanyDetails(ticker);
                } else {
                    showShareholderDetails(shareholder);
                }
            });
        }

        // Add event listener for Enter key in search input
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchShareholders();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const backButton = document.querySelector('#companyDetails .btn-secondary');
            if (backButton) {
                backButton.addEventListener('click', function() {
                    showCompanyList(false);
                });
            }
        });
    </script>
